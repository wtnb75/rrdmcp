[project]
name = "rrdmcp"
version = "0.1.0"
description = "MCP server exposing Munin RRD metrics to LLMs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
rrdmcp = "rrdmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrdmcp"]
