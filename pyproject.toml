[project]
name = "rrdmcp"
version = "0.1.0"
description = "MCP server exposing Munin RRD metrics to LLMs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
rrdmcp = "rrdmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "pytest-github-actions-annotate-failures",
    "ruff",
    "pdoc",
]

[tool.ruff]
extend-exclude = ["docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrdmcp"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["test_*.py"]
addopts = "--cov-report=html:cover --cov-report=term --cov-branch --cov-reset --cov=rrdmcp --doctest-modules"
